# CSS e JS minificados de verdade (12/11): o .min que o próprio jsDelivr gera para um ramo veio VELHO no @producao, mesmo depois do purge.
# Por isso o sufixo é -min (loren-min.js, loren-min.css), que o jsDelivr não minifica sozinho: arquivo que faltar dá 404, nunca uma versão velha.
# A cada push no producao, este fluxo gera aqui os *-min.js (terser) e *-min.css (clean-css) e publica o ramo producao-min = o producao + os -min,
# num commit que tem como pais o producao-min anterior e o producao (o ramo só avança, sem force push). Depois limpa o jsDelivr de @producao-min (mesmo script do purge do producao).
# - O producao não é tocado: publicar continua sendo "git push origin <hash>:producao", sempre fast-forward.
# - Sem laço: push feito com o GITHUB_TOKEN não dispara fluxo nenhum, e este só escuta o producao.
# - O Pages (ramo fichas, checkout-pages.yml) e o purge do @producao (purge-producao.yml) seguem iguais.
# O painel só usa o @producao-min com o código do cabeçalho gerado por "python painel/gera.py <hash> --min" (MIN = '-min').
# 18/11: no fim, publica no GitHub Pages (ramo fichas) o inicio.js e o esqueleto.css que o trecho fixo do painel (painel/TRECHO-FIXO.html) pede:
# minificados e com o jsDelivr apontando para ESTE commit do producao-min pelo hash (imutável: o navegador guarda e não precisa de purge).
name: Gerar os -min no ramo producao-min
on:
  push:
    branches: [producao]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: producao-min
  cancel-in-progress: false   # em fila: cada execução limpa o que o seu push mudou
jobs:
  min:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gera os -min (terser e clean-css) e confere a sintaxe
        run: |
          set -e
          npm i -g --silent terser@5.48.0 clean-css-cli@5.6.3
          git ls-files '*.js' '*.css' | grep -vE '^(\.github/|painel/)|[.-]min\.(js|css)$' > /tmp/fontes.txt
          while read -r f; do
            m="${f%.*}-min.${f##*.}"
            case "$f" in
              *.js) terser "$f" --compress --mangle --output "$m"; node --check "$m" ;;
              *.css) cleancss --output "$m" "$f" ;;
            esac
            [ -s "$m" ] || { echo "vazio: $m"; exit 1; }
            echo "$f $(wc -c < "$f") -> $m $(wc -c < "$m")"
          done < /tmp/fontes.txt
      - name: Publica o ramo producao-min (sem force push) e limpa o jsDelivr
        id: publica
        env:
          ANTES: ${{ github.event.before }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -E 's/\.(js|css)$/-min.\1/' /tmp/fontes.txt | xargs git add -f
          # commit com 2 pais (o producao-min anterior e este producao): o ramo só avança, sem force push. Com force push (12/11) o jsDelivr
          # continuou servindo arquivos do commit anterior por horas, mesmo depois do purge
          pais="-p $GITHUB_SHA"
          if git fetch -q origin producao-min 2>/dev/null; then pais="-p $(git rev-parse FETCH_HEAD) $pais"; fi
          novo=$(git commit-tree "$(git write-tree)" $pais -m "-min de producao ${GITHUB_SHA::7}")
          git push -q origin "$novo:refs/heads/producao-min"
          echo "novo=$novo" >> "$GITHUB_OUTPUT"
          servidos() { grep -vE '^(\.github/|painel/)|\.md$' || true; }
          # mesmo critério do purge do producao: o que mudou no push; à mão, ramo novo ou ANTES fora do histórico: tudo
          if [ -n "$ANTES" ] && [ -n "${ANTES//0/}" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            lista=$(git diff --name-only "$ANTES" "$GITHUB_SHA" | servidos)
          else
            lista=$(git ls-files | servidos)
          fi
          [ -n "$lista" ] || { echo "nenhum arquivo servido mudou: sem purge"; exit 0; }
          echo "$lista" | bash .github/scripts/purge-jsdelivr.sh producao-min
      - name: Publica o inicio.js e o esqueleto.css no GitHub Pages (ramo fichas), com o jsDelivr pelo hash do producao-min
        env:
          NOVO: ${{ steps.publica.outputs.novo }}
        run: |
          set -e
          [ -n "$NOVO" ]
          node painel/esqueleto.js > /tmp/esqueleto.css && cleancss --output /tmp/esqueleto-min.css /tmp/esqueleto.css && grep -q -- '--lm-esq' /tmp/esqueleto-min.css
          [ "$(grep -c '@COMMIT/' inicio.js)" = 1 ] && [ "$(grep -c "^  var MIN = '';" inicio.js)" = 1 ] && [ "$(grep -c '^  var V = ' inicio.js)" = 1 ]
          # V vazio: o hash na URL já versiona (com o ?v= de hora em hora o navegador baixaria de novo a cada hora)
          sed -e "s|@COMMIT/|@$NOVO/|" -e "s|^  var MIN = '';|  var MIN = '-min';|" -e "s|^  var V = .*|  var V = '';|" inicio.js > /tmp/inicio.js
          terser /tmp/inicio.js --compress --mangle --output /tmp/inicio-min.js && node --check /tmp/inicio-min.js && grep -q "$NOVO" /tmp/inicio-min.js
          # até 3 tentativas: o checkout-pages.yml e as fichas também empurram o ramo fichas
          for i in 1 2 3; do
            git fetch -q --depth=1 origin fichas
            rm -rf /tmp/pages; git worktree prune; git worktree add -q --detach /tmp/pages FETCH_HEAD
            cp /tmp/esqueleto-min.css /tmp/pages/esqueleto.css; cp /tmp/inicio-min.js /tmp/pages/inicio.js
            git -C /tmp/pages add esqueleto.css inicio.js
            if git -C /tmp/pages diff --cached --quiet; then echo "inicio.js e esqueleto.css já iguais"; exit 0; fi
            git -C /tmp/pages commit -q -m "inicio.js e esqueleto.css de producao ${GITHUB_SHA::7} (jsDelivr @${NOVO::7})"
            if git -C /tmp/pages push -q origin HEAD:fichas; then echo "ok: inicio.js e esqueleto.css no Pages (jsDelivr @$NOVO)"; exit 0; fi
            sleep 5
          done
          exit 1
