# CSS e JS minificados de verdade (12/11): o .min que o próprio jsDelivr gera para um ramo veio VELHO no @producao, mesmo depois do purge.
# Por isso o sufixo é -min (loren-min.js, loren-min.css), que o jsDelivr não minifica sozinho: arquivo que faltar dá 404, nunca uma versão velha.
# A cada push no producao, este fluxo gera aqui os *-min.js (terser) e *-min.css (clean-css) e publica o ramo producao-min = o producao + os -min,
# num commit só por cima do producao, com force push. Depois limpa o jsDelivr de @producao-min (mesmo script do purge do producao).
# - O producao não é tocado: publicar continua sendo "git push origin <hash>:producao", sempre fast-forward.
# - Sem laço: push feito com o GITHUB_TOKEN não dispara fluxo nenhum, e este só escuta o producao.
# - O Pages (ramo fichas, checkout-pages.yml) e o purge do @producao (purge-producao.yml) seguem iguais.
# O painel só usa o @producao-min com o código do cabeçalho gerado por "python painel/gera.py <hash> --min" (MIN = '-min').
name: Gerar os -min no ramo producao-min
on:
  push:
    branches: [producao]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: producao-min
  cancel-in-progress: false   # em fila: cada execução limpa o que o seu push mudou
jobs:
  min:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gera os -min (terser e clean-css) e confere a sintaxe
        run: |
          set -e
          npm i -g --silent terser@5.48.0 clean-css-cli@5.6.3
          git ls-files '*.js' '*.css' | grep -vE '^(\.github/|painel/)|[.-]min\.(js|css)$' > /tmp/fontes.txt
          while read -r f; do
            m="${f%.*}-min.${f##*.}"
            case "$f" in
              *.js) terser "$f" --compress --mangle --output "$m"; node --check "$m" ;;
              *.css) cleancss --output "$m" "$f" ;;
            esac
            [ -s "$m" ] || { echo "vazio: $m"; exit 1; }
            echo "$f $(wc -c < "$f") -> $m $(wc -c < "$m")"
          done < /tmp/fontes.txt
      - name: Publica o ramo producao-min (force push) e limpa o jsDelivr
        env:
          ANTES: ${{ github.event.before }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -E 's/\.(js|css)$/-min.\1/' /tmp/fontes.txt | xargs git add -f
          git commit -q -m "-min de producao ${GITHUB_SHA::7}"
          git push -q -f origin HEAD:refs/heads/producao-min
          servidos() { grep -vE '^(\.github/|painel/)|\.md$' || true; }
          # mesmo critério do purge do producao: o que mudou no push; à mão, ramo novo ou ANTES fora do histórico: tudo
          if [ -n "$ANTES" ] && [ -n "${ANTES//0/}" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            lista=$(git diff --name-only "$ANTES" "$GITHUB_SHA" | servidos)
          else
            lista=$(git ls-files | servidos)
          fi
          [ -n "$lista" ] || { echo "nenhum arquivo servido mudou: sem purge"; exit 0; }
          echo "$lista" | bash .github/scripts/purge-jsdelivr.sh producao-min
